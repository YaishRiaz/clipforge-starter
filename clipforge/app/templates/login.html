{% extends "base.html" %}{% block body %}
<div class="card" style="max-width:360px;margin:15vh auto 0">
<h1>ClipForge</h1>
{% if error %}<p class="bad">{{ error }}</p>{% endif %}
<form method="post" action="/login">
<label for="p">Password</label>
<input id="p" name="password" type="password" autofocus autocomplete="current-password">
<div class="row"><button>Log in</button></div>
</form></div>
{% endblock %}
